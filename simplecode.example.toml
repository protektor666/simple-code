# Simple Code — пример конфигурации
# Сохраните как simplecode.toml в корне проекта

# Какой провайдер использовать по умолчанию
provider = "openai"

# Модель по умолчанию (оставьте пустым для модели провайдера)
model = ""

# Максимальное количество шагов агента
max_agent_steps = 30

# Рабочая директория (по умолчанию текущая)
# working_dir = "/path/to/your/project"

# Директория для хранения сессий
sessions_dir = ".simplecode/sessions"

# Файл системного промпта (опционально)
# system_prompt_file = "AGENTS.md"

# ---------- Встроенные провайдеры ----------

[providers.openai]
# API ключ можно задать здесь или через OPENAI_API_KEY
api_key = ""
# base_url = ""  # Для совместимых API (Together, Groq и т.д.)
# default_model = "gpt-4o"

[providers.anthropic]
# API ключ можно задать здесь или через ANTHROPIC_API_KEY
api_key = ""
# default_model = "claude-sonnet-4-20250514"

