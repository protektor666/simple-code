# ---------- Управление через CLI ----------
#
# Вы также можете добавлять/удалять провайдеры через командную строку:
#
#   python main.py add-provider --name my-ollama --type ollama --url http://localhost:11434/v1
#   python main.py add-provider --name my-api --type custom --url https://my-api.com/v1 --api-key sk-xxx
#   python main.py providers              # Список всех провайдеров
#   python main.py test-provider my-ollama # Проверить подключение
#   python main.py remove-provider my-ollama
#
# И интерактивно через TUI:
#   /add-provider    — мастер добавления
#   /providers       — список провайдеров
#   /test-provider <имя> — проверка подключения
#   /use <имя>       — переключение
#   /remove-provider <имя> — удаление
